services:
  - type: web
    name: reben-api
    runtime: python
    buildCommand: python -m pip install --upgrade pip poetry && poetry install --only main --no-interaction
    startCommand: poetry run uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://reben-ui.onrender.com

  - type: static
    name: reben-ui
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://reben-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html